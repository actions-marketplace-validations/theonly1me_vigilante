''' }

[[case]]
name = "python: an alias of os.system, and a local function with the same name"
group = "python"
base = { "app.py" = '''
def start(name):
    return name
''' }
unsafe = { "app.py" = '''
from os import system as run_command


def start(name):
    return run_command(name)
''' }
safe = { "app.py" = '''
def system(name):
    return name.upper()


def start(name):
    return system(name)
''' }

[[case]]
name = "python: eval of request input"
group = "python"
base = { "app.py" = '''
def calculate(request):
    return 0
''' }
unsafe = { "app.py" = '''
def calculate(request):
    return eval(request.args["expression"])
''' }
safe = { "app.py" = '''
