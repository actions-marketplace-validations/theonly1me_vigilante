''' }

[[case]]
name = "python: a shell command built from a parameter"
group = "python"
base = { "app.py" = '''
import subprocess


def stamp(day):
    return subprocess.run(["date"])
''' }
unsafe = { "app.py" = '''
import subprocess


def stamp(day):
    return subprocess.run(f"date {day}", shell=True)
''' }
safe = { "app.py" = '''
import subprocess


def stamp(day):
    return subprocess.run("date -u", shell=True)
''' }

[[case]]
name = "python: request input that an object field carries to a command"
group = "python"
unsafe_result = "passes"
reason = "Known limit: the engine does not follow data through object fields."
base = { "app.py" = '''
import subprocess


class Job:
    def __init__(self, request):
        self.command = "date"

    def run(self):
        return subprocess.run([self.command])
''' }
unsafe = { "app.py" = '''
import subprocess


class Job:
    def __init__(self, request):
        self.command = request.args["command"]

    def run(self):
        return subprocess.run([self.command, self.command])
''' }
safe = { "app.py" = '''
import subprocess


class Job:
    def __init__(self, request):
        self.command = "date"

    def run(self):
        return subprocess.run([self.command, "-u"])
''' }

[[case]]
name = "javascript: query input reaches exec"
group = "javascript"
base = { "package.json" = '{"name": "app"}', "index.js" = '''
const { exec } = require("child_process");
exports.list = (req, res) => exec("ls -l");
''' }
unsafe = { "index.js" = '''
const { exec } = require("child_process");
exports.list = (req, res) => exec("ls " + req.query.folder);
''' }
safe = { "index.js" = '''
const { exec } = require("child_process");
exports.list = (req, res) => exec("ls -la");
''' }

[[case]]
name = "javascript: globalThis.fetch, and a local fetch function"
group = "javascript"
base = { "package.json" = '{"name": "app"}', "index.js" = '''
exports.add = (a, b) => a + b;
''' }
unsafe = { "index.js" = '''
exports.send = (url) => globalThis.fetch(url);
''' }
safe = { "index.js" = '''
function fetch(value) {
  return value;
}
exports.send = (url) => fetch(url);
''' }

[[case]]
name = "javascript: new Function with body input"
group = "javascript"
base = { "package.json" = '{"name": "app"}', "index.js" = '''
exports.calculate = (req) => 0;
''' }
unsafe = { "index.js" = '''
exports.calculate = (req) => new Function(req.body.code)();
''' }
safe = { "index.js" = '''
exports.calculate = (req) => Number(req.body.value);
''' }

[[case]]
name = "javascript: a worker whose fetch handler calls the global fetch"
group = "javascript"
base = { "package.json" = '{"name": "worker"}', "worker.js" = '''
export default {
  async fetch(request) {
    return new Response("ok");
  },
};
''' }
unsafe = { "worker.js" = '''
export default {
  async fetch(request) {
    return fetch("https://example.com/data");
  },
};
''' }
safe = { "worker.js" = '''
export default {
  async fetch(request) {
    return new Response("ready");
  },
};
''' }

[[case]]
