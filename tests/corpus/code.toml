[[case]]
name = "python: request input reaches a shell"
group = "python"
base = { "app.py" = '''
import subprocess


def export(request):
    return subprocess.run(["date"])
''' }
unsafe = { "app.py" = '''
import subprocess


def export(request):
    return subprocess.run(request.args["day"], shell=True)
''' }
safe = { "app.py" = '''
import subprocess


def export(request):
    return subprocess.run(["date", "-u"])
''' }

[[case]]
name = "python: first network call in a package"
group = "python"
base = { "app.py" = '''
def total(items):
    return sum(items)
''' }
unsafe = { "app.py" = '''
import urllib.request


def fetch(url):
    return urllib.request.urlopen(url)
''' }
safe = { "app.py" = '''
