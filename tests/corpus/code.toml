[[case]]
name = "java: a request parameter reaches Runtime.exec"
group = "java"
base = { "App.java" = '''
class App {
    void run(javax.servlet.http.HttpServletRequest request) throws Exception {
        Runtime.getRuntime().exec("date");
    }
}
''' }
unsafe = { "App.java" = '''
class App {
    void run(javax.servlet.http.HttpServletRequest request) throws Exception {
        Runtime.getRuntime().exec(request.getParameter("command"));
    }
}
''' }
safe = { "App.java" = '''
class App {
    void run(javax.servlet.http.HttpServletRequest request) throws Exception {
        Runtime.getRuntime().exec("date -u");
    }
}
''' }

[[case]]
name = "rust: a module alias for std::process"
group = "rust"
base = { "Cargo.toml" = '''
[package]
name = "app"
version = "0.1.0"
edition = "2021"
''', "Cargo.lock" = '''
version = 4

[[package]]
name = "app"
version = "0.1.0"
''', "src/lib.rs" = '''
pub fn add(first: i32, second: i32) -> i32 {
    first + second
}
''' }
unsafe = { "src/lib.rs" = '''
use std::process as p;

pub fn run() {
    p::Command::new("date").status().ok();
}
''' }
safe = { "src/lib.rs" = '''
pub fn name() -> &'static str {
    "date"
}
''' }

[[case]]
name = "rust: a command that becomes dynamic"
group = "rust"
unsafe_result = "shows"
reason = "A dynamic command is shown, and it does not block."
base = { "Cargo.toml" = '''
[package]
name = "app"
version = "0.1.0"
edition = "2021"
''', "Cargo.lock" = '''
version = 4

[[package]]
name = "app"
version = "0.1.0"
''', "src/lib.rs" = '''
use std::process::Command;

pub fn run(program: &str) {
    Command::new("date").status().ok();
}
''' }
unsafe = { "src/lib.rs" = '''
use std::process::Command;

pub fn run(program: &str) {
    Command::new(program).status().ok();
}
''' }
safe = { "src/lib.rs" = '''
use std::process::Command;

pub fn run(program: &str) {
    Command::new("date").arg("-u").status().ok();
}
''' }

