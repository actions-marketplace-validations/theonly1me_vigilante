id: csharp-exec
language: csharp
message: Runs other programs
metadata:
  capability: exec
rule:
  any:
    - kind: invocation_expression
      regex: ^(System\.Diagnostics\.)?Process\s*\.\s*Start\s*\(
    - kind: object_creation_expression
      has: { field: type, regex: ^(System\.Diagnostics\.)?(Process|ProcessStartInfo)$ }
    - kind: using_directive
      regex: ^using\s+CliWrap\b
---
id: csharp-network
language: csharp
message: Uses the network
metadata:
  capability: network
rule:
  any:
    - kind: object_creation_expression
      has:
        field: type
        regex: ^(System\.Net\.(Http\.|Sockets\.|WebSockets\.)?)?(HttpClient|TcpClient|UdpClient|TcpListener|Socket|ClientWebSocket|WebClient|SmtpClient|RestClient)$
    - kind: using_directive
      regex: ^using\s+(static\s+)?(System\.Net\.(Http|Sockets|WebSockets|Mail)|RestSharp|Grpc\.Net)\b
    - kind: invocation_expression
      regex: ^(WebRequest|HttpWebRequest)\s*\.\s*Create\b
    - kind: identifier
      regex: ^(HttpClient|IHttpClientFactory)$
---
id: csharp-native
language: csharp
message: Uses unsafe code or native code
metadata:
  capability: native
rule:
  any:
    - kind: attribute
      has: { field: name, regex: ^(DllImport|LibraryImport)(Attribute)?$ }
    - kind: modifier
      regex: ^unsafe$
    - kind: unsafe_statement
    - kind: fixed_statement
    - kind: invocation_expression
      regex: ^(Marshal|NativeLibrary)\s*\.
---
id: csharp-dynamic-code
language: csharp
message: Loads or builds code at run time
metadata:
  capability: dynamic_code
rule:
  any:
    - kind: using_directive
      regex: ^using\s+(static\s+)?(System\.Reflection\.Emit|Microsoft\.CodeAnalysis\.CSharp\.Scripting)\b
    - kind: invocation_expression
      regex: ^(Assembly\s*\.\s*Load\w*|Activator\s*\.\s*CreateInstance|Type\s*\.\s*GetType|CSharpScript\s*\.\s*\w+)\b
---
id: csharp-env-read
language: csharp
message: Reads environment variables
metadata:
  capability: read_system_state
rule:
  kind: invocation_expression
  regex: ^Environment\s*\.\s*GetEnvironmentVariables?\b
---
id: csharp-files
language: csharp
message: Reads or changes files
metadata:
  capability: files
rule:
  any:
    - kind: invocation_expression
      regex: ^(System\.IO\.)?(File\s*\.\s*\w+|Directory\s*\.\s*(CreateDirectory|Delete|Exists|Move|GetFiles|GetDirectories|GetFileSystemEntries|EnumerateFiles|EnumerateDirectories|EnumerateFileSystemEntries))\s*\(
    - kind: object_creation_expression
      has: { field: type, regex: ^(System\.IO\.)?(FileStream|FileInfo|DirectoryInfo)$ }
---
id: csharp-system-info
language: csharp
message: Reads system information
metadata:
  capability: read_system_state
rule:
  any:
    - kind: member_access_expression
      regex: ^Environment\s*\.\s*(MachineName|UserName|UserDomainName|CurrentDirectory|ProcessId|ProcessPath|OSVersion)$
      not: { inside: { kind: assignment_expression, field: left } }
    - kind: invocation_expression
      regex: ^(Environment\s*\.\s*(GetCommandLineArgs|GetFolderPath)|Dns\s*\.\s*GetHostName)\s*\(
---
id: csharp-modify-system-state
language: csharp
message: Changes environment variables, the working folder, or signal handlers
metadata:
  capability: modify_system_state
rule:
  any:
    - kind: invocation_expression
      regex: ^(Environment\s*\.\s*SetEnvironmentVariable|Directory\s*\.\s*SetCurrentDirectory|PosixSignalRegistration\s*\.\s*Create)\s*\(
    - kind: assignment_expression
      has: { field: left, regex: ^Environment\s*\.\s*CurrentDirectory$ }
