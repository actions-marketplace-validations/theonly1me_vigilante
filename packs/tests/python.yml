id: python-exec-import
valid:
  - "import os"
  - "x = 'import subprocess'"
  - "# import subprocess"
  - "from mysubprocess import run"
invalid:
  - "import subprocess"
  - "import os, subprocess as sp"
  - "from subprocess import run"
  - "import pty"
---
id: python-exec-call
valid:
  - "model.system('x')"
  - "os.path.join(a, b)"
  - "asyncio.create_task(run())"
invalid:
  - "os.system('make')"
  - "stream = os.popen('ls')"
  - "os.execvp('ls', ['ls'])"
  - "process = await asyncio.create_subprocess_exec('ls')"
  - "process = await asyncio.create_subprocess_shell('ls -l')"
---
id: python-network-import
valid:
  - "import json"
  - "from urllib.parse import urlparse"
  - "import requests_mock_helpers"
invalid:
  - "import requests"
  - "from httpx import AsyncClient"
  - "import urllib.request"
  - "import socket"
  - "from aiohttp import web"
---
id: python-native-import
valid:
  - "import typing"
invalid:
  - "import ctypes"
  - "from cffi import FFI"
---
id: python-dynamic-code-call
valid:
  - "score = evaluate(model)"
  - "model.eval()"
  - "cursor.exec(query)"
invalid:
  - "result = eval(expression)"
  - "exec(source)"
  - "module = __import__(name)"
  - "module = importlib.import_module(name)"
---
id: python-env-read
valid:
  - "os.environ['TOKEN'] = value"
  - "os.environ.update(values)"
  - "environment = 'os.environ'"
  - "path = os.path.join(a)"
invalid:
  - "value = os.environ['TOKEN']"
  - "value = os.getenv('TOKEN')"
---
id: python-files
valid:
  - "webbrowser.open(url)"
  - "connection = open_connection(host)"
  - "path = os.path.join(a, b)"
  - "text = 'open(path)'"
invalid:
  - "with open(path) as handle:\n    data = handle.read()"
  - "os.remove(path)"
  - "os.makedirs(folder, exist_ok=True)"
  - "import shutil"
  - "from tempfile import NamedTemporaryFile"
  - "files = glob.glob('*.csv')"
---
id: python-system-info
valid:
  - "name = config.hostname"
  - "path = os.path.join(a, b)"
invalid:
  - "folder = os.getcwd()"
  - "name = socket.gethostname()"
  - "user = getpass.getuser()"
  - "process_id = os.getpid()"
---
id: python-modify-system-state
valid:
  - "value = os.environ['TOKEN']"
  - "value = os.environ.get('TOKEN')"
  - "settings['TOKEN'] = value"
invalid:
  - "os.environ['TOKEN'] = value"
  - "del os.environ['TOKEN']"
  - "os.environ.update(values)"
  - "os.putenv('TOKEN', value)"
  - "os.chdir(folder)"
  - "signal.signal(signal.SIGTERM, handler)"
