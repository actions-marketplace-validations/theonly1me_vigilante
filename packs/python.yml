id: python-exec-import
language: python
message: Imports a module that runs other programs
metadata:
  capability: exec
rule:
  kind: dotted_name
  regex: ^(subprocess|pty)(\.|$)
  any:
    - inside: { kind: import_statement, stopBy: end }
    - inside: { kind: import_from_statement, field: module_name }
---
id: python-exec-call
language: python
message: Runs another program
metadata:
  capability: exec
rule:
  kind: call
  has:
    field: function
    regex: ^(os\.(system|popen|exec[lv]p?e?|spawn[lv]p?e?|posix_spawnp?)|asyncio\.create_subprocess_(exec|shell))$
---
id: python-network-import
language: python
message: Imports a network module
metadata:
  capability: network
rule:
  kind: dotted_name
  regex: ^(socket|requests|httpx|aiohttp|urllib3|urllib\.request|http\.client|websockets?|paramiko|grpc|ftplib|smtplib)(\.|$)
  any:
    - inside: { kind: import_statement, stopBy: end }
    - inside: { kind: import_from_statement, field: module_name }
---
id: python-native-import
language: python
message: Imports a module that calls native code
metadata:
  capability: native
rule:
  kind: dotted_name
  regex: ^(ctypes|cffi)(\.|$)
  any:
    - inside: { kind: import_statement, stopBy: end }
    - inside: { kind: import_from_statement, field: module_name }
---
id: python-dynamic-code-call
language: python
message: Runs code that is built at run time
metadata:
  capability: dynamic_code
rule:
  kind: call
  has:
    field: function
    regex: ^(eval|exec|__import__|importlib\.import_module)$
---
id: python-env-read
language: python
message: Reads environment variables
metadata:
  capability: read_system_state
rule:
  kind: attribute
  regex: ^os\.(environ|getenv)$
  not:
    any:
      - inside: { kind: assignment, field: left, stopBy: end }
      - inside: { kind: delete_statement, stopBy: end }
      - inside:
          kind: attribute
          regex: ^os\.environ\.(update|pop|popitem|setdefault|clear)$
---
id: python-files
language: python
message: Reads or changes files
metadata:
  capability: files
rule:
  any:
    - kind: call
      has:
        field: function
        regex: ^(open|io\.open|os\.(remove|unlink|rename|renames|replace|mkdir|makedirs|rmdir|removedirs|chmod|chown|lchown|link|symlink|listdir|scandir|walk|truncate|mkfifo|fdopen)|glob\.i?glob)$
    - kind: dotted_name
      regex: ^(shutil|tempfile)(\.|$)
      any:
        - inside: { kind: import_statement, stopBy: end }
        - inside: { kind: import_from_statement, field: module_name }
---
id: python-system-info
language: python
message: Reads system information
metadata:
  capability: read_system_state
rule:
  kind: call
  has:
    field: function
    regex: ^(os\.(getcwd|getcwdb|getpid|getppid|getuid|geteuid|getgid|getegid|getlogin|uname|getloadavg)|socket\.(gethostname|getfqdn)|platform\.(node|uname)|getpass\.getuser)$
---
id: python-modify-system-state
language: python
message: Changes environment variables, the working folder, or signal handlers
metadata:
  capability: modify_system_state
rule:
  any:
    - kind: call
      has:
        field: function
        regex: ^(os\.(putenv|unsetenv|chdir|fchdir|umask|setuid|setgid|seteuid|setegid|setsid|nice)|os\.environ\.(update|pop|popitem|setdefault|clear)|signal\.signal)$
    - kind: assignment
      has: { field: left, kind: subscript, regex: '^os\.environ\[' }
    - kind: delete_statement
      regex: ^del\s+os\.environ\[
