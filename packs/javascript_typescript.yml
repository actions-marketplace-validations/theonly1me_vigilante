id: js-exec-module
language: tsx
message: Imports a module that runs other programs
metadata:
  capability: exec
rule:
  kind: string
  regex: ^["'](node:)?(child_process|execa|shelljs|cross-spawn|zx)["']$
  any:
    - inside: { kind: import_statement, field: source }
    - inside: { kind: export_statement, field: source }
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, regex: ^(require|import)$ }
---
id: js-exec-call
language: tsx
message: Runs another program
metadata:
  capability: exec
rule:
  kind: member_expression
  regex: ^(Bun\.spawn(Sync)?|Deno\.(run|Command))$
---
id: js-network-module
language: tsx
message: Imports a network module
metadata:
  capability: network
rule:
  kind: string
  regex: ^["']((node:)?(http|https|http2|net|dgram|tls)|axios|undici|got|node-fetch|ws|socket\.io-client|ky)["']$
  any:
    - inside: { kind: import_statement, field: source }
    - inside: { kind: export_statement, field: source }
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, regex: ^(require|import)$ }
---
id: js-network-call
language: tsx
message: Makes a network request
metadata:
  capability: network
rule:
  any:
    - kind: call_expression
      has: { field: function, kind: identifier, regex: ^fetch$ }
    - kind: new_expression
      has: { field: constructor, regex: ^(WebSocket|XMLHttpRequest|EventSource)$ }
---
id: js-native-module
language: tsx
message: Loads native code
metadata:
  capability: native
rule:
  kind: string
  regex: ^["']((ffi-napi|koffi|bindings|node-gyp-build)|(\.{1,2}/|/)[^"']*\.node)["']$
  any:
    - inside: { kind: import_statement, field: source }
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, regex: ^(require|import)$ }
---
id: js-dynamic-code
language: tsx
message: Runs code that is built at run time
metadata:
  capability: dynamic_code
rule:
  any:
    - kind: call_expression
      has: { field: function, kind: identifier, regex: ^eval$ }
    - kind: new_expression
      has: { field: constructor, regex: ^Function$ }
    - kind: member_expression
      regex: ^vm\.(runIn\w*|Script|compileFunction)$
---
id: js-env-read
language: tsx
message: Reads environment variables
metadata:
  capability: read_system_state
rule:
  kind: member_expression
  regex: ^(process|Deno|Bun)\.env$
  not:
    any:
      - inside: { kind: assignment_expression, field: left, stopBy: end }
      - inside: { kind: unary_expression, regex: ^delete\b, stopBy: end }
---
id: js-files-module
language: tsx
message: Imports a file system module
metadata:
  capability: files
rule:
  kind: string
  regex: ^["']((node:)?fs(/promises)?|fs-extra|graceful-fs)["']$
  any:
    - inside: { kind: import_statement, field: source }
    - inside: { kind: export_statement, field: source }
    - inside:
        kind: arguments
        inside:
          kind: call_expression
          has: { field: function, regex: ^(require|import)$ }
---
id: js-files-call
language: tsx
message: Reads or changes files
metadata:
  capability: files
rule:
  kind: member_expression
  regex: ^(Deno\.(readFile|readTextFile|writeFile|writeTextFile|remove|mkdir|open|create|readDir|rename|chmod|copyFile|makeTempFile|makeTempDir)|Bun\.(file|write))$
---
id: js-system-info
language: tsx
message: Reads system information
metadata:
  capability: read_system_state
rule:
  any:
    - kind: member_expression
      regex: ^process\.(cwd|pid|ppid|getuid|geteuid|getgid|getegid)$
    - kind: string
      regex: ^["'](node:)?os["']$
      any:
        - inside: { kind: import_statement, field: source }
        - inside: { kind: export_statement, field: source }
        - inside:
            kind: arguments
            inside:
              kind: call_expression
              has: { field: function, regex: ^(require|import)$ }
---
id: js-modify-system-state
language: tsx
message: Changes environment variables, the working folder, or signal handlers
metadata:
  capability: modify_system_state
rule:
  any:
    - kind: assignment_expression
      has: { field: left, regex: '^process\.env(\.|\[)' }
    - kind: unary_expression
      regex: '^delete\s+process\.env(\.|\[)'
    - kind: call_expression
      has:
        field: function
        regex: ^(process\.(chdir|umask|setuid|setgid|seteuid|setegid|setgroups)|Deno\.(env\.(set|delete)|chdir))$
    - kind: call_expression
      regex: ^process\.on\(\s*["']SIG
