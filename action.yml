name: vigilante-scan
description: Show the new powers that a pull request gives to code, CI, build, and AI agents
author: theonly1me
branding:
  icon: shield
  color: gray-dark

inputs:
  version:
    description: The Vigilante version to download and verify
    default: "0.3.2" # x-release-please-version
  comment:
    description: Write the report as one comment on the pull request. The job needs the permission pull-requests write.
    default: "false"

runs:
  using: composite
  steps:
    - id: go
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/detect-go.sh"'
    - if: steps.go.outputs.modules == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: stable
        cache: false
    - if: steps.go.outputs.modules == 'true'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/install-capslock.sh"'
      env:
        CAPSLOCK_VERSION: v0.3.3
    - shell: bash
      run: '"$GITHUB_ACTION_PATH/action/install.sh"'
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vigilante-cache/vigilante
        key: vigilante-packages-${{ runner.os }}-${{ hashFiles('**/bun.lock', '**/package-lock.json', '**/npm-shrinkwrap.json', '**/pnpm-lock.yaml', '**/yarn.lock', '**/uv.lock', '**/poetry.lock', '**/Pipfile.lock', '**/requirements*.txt', '**/pom.xml', '**/gradle.lockfile', '**/Cargo.lock', '**/packages.lock.json', '**/*.csproj', '**/Directory.Packages.props', '**/Gemfile.lock', '**/gems.locked') }}
        restore-keys: vigilante-packages-${{ runner.os }}-
    - id: review
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/review.sh"'
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        XDG_CACHE_HOME: ${{ runner.temp }}/vigilante-cache
        REPORT_FILE: ${{ runner.temp }}/vigilante-report.md
    - if: always() && steps.review.outcome != 'skipped' && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: '"$GITHUB_ACTION_PATH/action/comment.sh"'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPOSITORY: ${{ github.repository }}
        REPORT_FILE: ${{ runner.temp }}/vigilante-report.md
        REVIEW_OUTCOME: ${{ steps.review.outcome }}
