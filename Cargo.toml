[package]
name = "vigilante"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shows the new powers that a pull request gives to code, CI, build, and AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theonly1me/vigilante"
keywords = ["security", "capabilities", "ci", "agents", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "packs/**/*", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
ast-grep-config = { version = "0.45.3", default-features = false }
ast-grep-core = { version = "0.45.3", default-features = false, features = ["tree-sitter"] }
ast-grep-language = { version = "0.45.3", default-features = false, features = [
    "tree-sitter-c-sharp",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
saphyr = "0.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
