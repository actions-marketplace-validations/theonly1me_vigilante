[package]
name = "vigilante"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "Shows the new powers that a pull request gives to code, CI, build, and AI agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/theonly1me/vigilante"
keywords = ["security", "capabilities", "ci", "agents", "supply-chain"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*.rs", "src/**/*.mjs", "src/**/*.txt", "packs/**/*.yml", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE"]

[dependencies]
ast-grep-config = { version = "0.50.0", default-features = false }
ast-grep-core = { version = "0.50.0", default-features = false, features = ["tree-sitter"] }
ast-grep-language = { version = "0.50.0", default-features = false, features = [
    "tree-sitter-c-sharp",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-typescript",
] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
globset = "0.4.20"
ignore = "0.4.33"
quick-xml = "0.42.0"
saphyr = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1.6"
ureq = "3.4.2"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
