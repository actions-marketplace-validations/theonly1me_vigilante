name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of an existing release to publish again, for example v0.1.0
        type: string
        default: ""

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ inputs.tag || steps.release.outputs.tag_name }}
      publish: ${{ (github.event_name == 'workflow_dispatch' && inputs.tag != '') || steps.release.outputs.release_created == 'true' }}
    steps:
      - id: release
        if: github.event_name == 'push' || inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  build:
    needs: [gate, release-please]
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}

  github:
    needs: [release-please, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}

  crates:
    needs: [gate, release-please, github]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      needs.release-please.outputs.publish == 'true' &&
      (needs.github.result == 'success' || needs.release-please.outputs.created != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - id: published
        run: packaging/crate-published.sh "$TAG" >> "$GITHUB_OUTPUT"
      - id: auth
        if: steps.published.outputs.exists == 'false' && env.HAS_TOKEN == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.published.outputs.exists == 'false'
        run: |
          rustup toolchain install stable --profile minimal
          node packaging/registry-readme.mjs > "$RUNNER_TEMP/README.md"
          mv "$RUNNER_TEMP/README.md" README.md
          cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    needs: [gate, release-please, github]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      needs.release-please.outputs.publish == 'true' &&
      (needs.github.result == 'success' || needs.release-please.outputs.created != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: packaging/download-release.sh "$TAG" "$PATTERN" "$FOLDER"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          PATTERN: theonly1me-vigilante-*.tgz
          FOLDER: npm-packages
      - run: packaging/publish-npm.sh npm-packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: [gate, release-please, github]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      needs.release-please.outputs.publish == 'true' &&
      (needs.github.result == 'success' || needs.release-please.outputs.created != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packaging/download-release.sh "$TAG" "$PATTERN" "$FOLDER"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          PATTERN: "*.whl"
          FOLDER: wheels
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels/
          skip-existing: true

  homebrew:
    needs: [gate, release-please, github]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' &&
      needs.release-please.outputs.publish == 'true' &&
      (needs.github.result == 'success' || needs.release-please.outputs.created != 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: packaging/download-release.sh "$TAG" "$PATTERN" "$FOLDER"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          PATTERN: vigilante.rb
          FOLDER: dist
      - run: packaging/publish-homebrew.sh dist/vigilante.rb "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
